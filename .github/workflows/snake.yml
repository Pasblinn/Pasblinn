name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Pasblinn
          outputs: |
            dist/github-snake.svg?color_snake=#8957e5&color_dots=#9be9a8,#40c463,#30a14e,#216e39,#0d4429
            dist/github-snake-dark.svg?color_snake=#a371f7&color_dots=#9be9a8,#39d353,#26a641,#006d32,#0e4429

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
